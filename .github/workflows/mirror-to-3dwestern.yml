# Keeps 3DWestern/dashboard-frontend (the repo Vercel deploys from, on the free
# personal account) identical to this repo. Develop here, in the org; never commit
# to the mirror, because every sync overwrites it.
#
# Runs on every push (all branches and tags) and branch/tag deletion, and can be
# started by hand (Actions > Mirror to 3DWestern > Run workflow). Auth: the deploy
# key in secret MIRROR_SSH_KEY, whose public half has write access to the mirror only.
name: Mirror to 3DWestern

on:
  push:
    branches: ["**"]
    tags: ["**"]
  delete:
  workflow_dispatch:

concurrency:
  group: mirror-to-3dwestern
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == '3D-Western/dashboard-frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Push every branch and tag to the mirror
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git remote set-head origin -d || true
          # --prune removes branches/tags from the mirror that no longer exist here.
          git push --prune git@github.com:3DWestern/dashboard-frontend.git \
            '+refs/remotes/origin/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
