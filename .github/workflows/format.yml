name: Format
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1️⃣ Checkout the correct branch (PR or direct push)
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # 2️⃣ Setup Node.js with caching
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      # 3️⃣ Install dependencies (fast because of cache)
      - run: npm ci --include=optional

      # 4️⃣ Run Prettier formatting
      - run: npm run format

      # 5️⃣ Commit only if Prettier changed any files
      - name: Commit formatted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: auto-format with Prettier"
            git push
          fi
