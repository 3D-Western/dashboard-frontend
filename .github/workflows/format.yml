name: Format
on: push

jobs:
  format-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1️⃣ Checkout the branch that triggered this workflow
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # 2️⃣ Setup Node.js and enable built-in npm caching
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      # 3️⃣ Install dependencies (cached)
      - run: npm ci --include=optional

      # 4️⃣ Run Prettier formatting
      - run: npm run format

      # 5️⃣ Commit formatted changes only if any files changed
      - name: Commit formatted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: auto-format with Prettier"
            git push
        fi
