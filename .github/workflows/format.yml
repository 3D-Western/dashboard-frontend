name: Format
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # 1️⃣ Checkout the correct branch (PR or direct push)
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # 2️⃣ Setup pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # 3️⃣ Setup Node.js with pnpm caching
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'pnpm'

      # 4️⃣ Install dependencies (fast because of cache)
      - run: pnpm install --frozen-lockfile

      # 5️⃣ Check code formatting (without modifying files)
      - name: Check formatting with Prettier
        run: pnpm exec prettier --check .

      # 6️⃣ Generate job summary
      - name: Generate format summary
        if: always()
        run: |
          echo "## Format Check Results :art:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo ":white_check_mark: All files are properly formatted!" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: Some files need formatting. Run \`pnpm run format\` locally." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Node Version**: 24" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Manager**: pnpm 11" >> $GITHUB_STEP_SUMMARY
          echo "- **Formatter**: Prettier (check-only mode)" >> $GITHUB_STEP_SUMMARY
